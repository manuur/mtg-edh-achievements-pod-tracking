name: Apply database migrations

on:
  workflow_dispatch:
    inputs:
      target:
        description: GitHub Environment whose database should be migrated
        required: true
        type: choice
        options:
          - development
          - production

permissions:
  contents: read

concurrency:
  group: database-migration-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.target }}
    env:
      DATABASE_MIGRATION_URL: ${{ secrets.DATABASE_MIGRATION_URL }}
      # The verification script intentionally uses the ordinary variable name.
      DATABASE_URL: ${{ secrets.DATABASE_MIGRATION_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm db:verify
