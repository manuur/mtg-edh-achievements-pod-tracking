name: Backup restore drill

on:
  workflow_dispatch:
    inputs:
      backup_key:
        description: Encrypted R2 object key, such as daily/2026-08-22.dump.enc
        required: true

permissions:
  contents: read

jobs:
  restore:
    runs-on: ubuntu-latest
    environment: restore-drill
    timeout-minutes: 30
    env:
      RESTORE_DATABASE_URL: ${{ secrets.RESTORE_DATABASE_URL }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
      BACKUP_KEY: ${{ inputs.backup_key }}
    steps:
      - name: Install clients
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client awscli
      - name: Download and decrypt
        run: aws --endpoint-url "$R2_ENDPOINT" s3 cp "s3://$R2_BUCKET/$BACKUP_KEY" backup.dump.enc && openssl enc -d -aes-256-cbc -pbkdf2 -pass env:BACKUP_ENCRYPTION_PASSPHRASE -in backup.dump.enc -out backup.dump
      - name: Restore into disposable target
        run: pg_restore --exit-on-error --no-owner --no-privileges --dbname "$RESTORE_DATABASE_URL" backup.dump
      - name: Verify restored domain schema
        run: psql "$RESTORE_DATABASE_URL" -v ON_ERROR_STOP=1 -c "select count(*) as app_tables from pg_tables where schemaname = 'app';"
